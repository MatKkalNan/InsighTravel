<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>InsighTravel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>✈️</text></svg>">
  <style>
    @font-face {
      font-family: 'MainFont';
      src: url('/static/concon.ttf') format('truetype'); 
      font-weight: normal;
      font-style: normal;
  }
    body {
      font-family: 'MainFont', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7; margin: 0; padding: 0; display: flex; height: 100vh; color: #222;
    }
    .container { display: flex; flex-direction: row; width: 100%; height: 100%; }
    
    /* 사이드바 */
    .sidebar {
      width: 260px; background-color: #bedcfa; display: flex; flex-direction: column;
      padding: 20px; border-right: 1px solid #bedcfa; flex-shrink: 0;
    }
    .sidebar-header { font-size: 18px; font-weight: 800; color: #333; margin-bottom: 24px; }
    .new-chat-btn {
      background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px;
    }
    .history-label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 12px; text-transform: uppercase; }
    .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #4a5568; text-decoration: none; cursor: pointer; }
    .history-item:hover { background-color: #edf2f7;}
    .history-item.active { background-color: #ffffff; font-weight: 600; }

    /* 사이드바 아이템 레이아웃 수정 */
    .history-item {
    display: flex !important; justify-content: space-between; align-items: center; padding: 10px 12px;
    border-radius: 8px; font-size: 14px; color: #4a5568; cursor: pointer; position: relative;
    margin-bottom: 4px; }

    .item-actions {
    display: none; /* 평소에는 숨김 */ gap: 4px; align-items: center; margin-left: 8px;}

    .history-item:hover .item-actions {
    display: flex !important; /* 호버 시 표시 */}

    .action-btn {
    background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px;
    border-radius: 4px; line-height: 1;}

    .action-btn:hover { background: #e2e8f0;}

    /* 채팅 영역 */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid #eee; font-weight: 600; font-size: 15px; background: #ffffff; }
    .chat-log { display: flex; flex: 1; padding: 16px; overflow-y: auto; background: #ffffff; }

    /* 메시지 스타일 */
    .message { margin-bottom: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .message.user { align-self: flex-end; background: #67adf9; color: #fff; border-radius: 16px 16px 2px 16px; padding: 8px 12px; }
    .message.assistant { align-self: flex-start; background: #e5effa; border-radius: 16px 16px 16px 2px; padding: 8px 12px; border: 1px solid #e1e1e1; }
    
    /* 메시지 행 레이아웃 */
    .message-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px;}
    .message-row.assistant { flex-direction: row;}

    .message-row.user { flex-direction: row-reverse; justify-content: flex-end;}

    /* 프로필 이미지 */
    .profile-avatar { width: 60px;height: 60px; border-radius: 50%; object-fit: cover; flex-shrink: 0;}

    /* 메시지 콘텐츠 */
    .message-content { display: flex; flex-direction: column; gap: 4px; flex: 1;}

    .profile-name {
      font-size: 12px; font-weight: 600; color: #666;}

    /* 점 애니메이션 */
    .loading .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background-color: #999; margin: 0 4px; animation: dotAnimation 1.4s infinite;
    }
    
    .loading .dot:nth-child(1) { animation-delay: 0s;}
    .loading .dot:nth-child(2) { animation-delay: 0.2s;}  
    .loading .dot:nth-child(3) { animation-delay: 0.4s;}
    
    @keyframes dotAnimation { 0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    /* 하단 입력바 */
    .input-panel { padding: 15px; border-top: 1px solid #eee; background: #fafafa; }
    .input-row { display: flex; align-items: stretch; gap: 10px; width: 100%; }
    #user-input {
      flex: 1; min-height: 44px; max-height: 80px; resize: none;
      padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;
    }
    .send-btn {
      height: 44px; padding: 0 20px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; background: #80baf8; color: white;
      white-space: nowrap; flex-shrink: 0;
    }
    .hint { font-size: 11px; color: #888; margin-top: 8px; }

    /* 미니브라우저 및 모달 스타일  */
    .agent-browser { background: #fff; border-radius: 12px; overflow: hidden; margin: 12px 0; border: 1px solid #e0e0e0; 
        box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .agent-browser-bar { background: #f5f5f5; padding: 8px 12px; display: flex; gap: 6px; }
    .browser-dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ff5f57; } .dot-yellow { background: #ffbd2e; } .dot-green { background: #28c840; }
    .agent-browser iframe { width: 100%; height: 560px; border: none; }
    .agent-status { padding: 7px 12px; background: #f0f7ff; color: #1a73e8; font-size: 12px; text-align: center; }
    .modal-overlay, .sel-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); 
        z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.active, .sel-modal-overlay.active { display: flex; }
    .modal-box, .sel-modal-box {background: #fff; border-radius: 16px; padding: 28px 28px 24px; width: 420px; max-width: 95vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18); animation: modalIn 0.25s ease-out;}
    .sel-modal-box { width: 520px; padding: 24px 22px 20px;}
    @keyframes modalIn {
        from { opacity: 0; transform: scale(0.93) translateY(12px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
    .modal-title, .sel-modal-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 6px;}
    .modal-subtitle, .sel-modal-subtitle { font-size: 13px; color: #666; margin-bottom: 20px;}
    .modal-field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;} 
    .modal-field-group .full { grid-column: 1 / -1; }
    .modal-field { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
        font-size: 14px; outline: none; transition: border-color 0.2s;}
    .modal-field:focus { border-color: #80baf8; }
    .modal-section-label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase;
        letter-spacing: 0.5px; margin: 14px 0 8px;}
    .modal-actions, .sel-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-cancel-btn, .sel-cancel-btn {
        flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #ddd;
        background: #fff; color: #444; font-size: 14px; cursor: pointer;}
    .modal-confirm-btn, .sel-confirm-btn {flex: 2; padding: 11px; border-radius: 8px; border: none;
            background: #80baf8; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;}
  
    /* 선택 카드 리스트 */
    .sel-card-list {
        display: flex; flex-direction: column; gap: 8px; max-height: 380px;
        overflow-y: auto; margin-bottom: 16px; padding-right: 2px;
      }
  
      .sel-card {
        border: 2px solid #e8eaf0; border-radius: 12px; padding: 13px 15px;
        cursor: pointer; transition: all .18s; background: #fff; position: relative;
      }
  
      .sel-card:hover { border-color: #4693f8; }
      .sel-card.sel-selected { border-color: #4693f8; background: #f0f6ff; }
  
      .sel-card.sel-selected::after {
        content: '✓'; position: absolute; top: 10px; right: 12px;
        background: #4693f8; color: #fff; width: 20px; height: 20px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700;
      }
  
      .sel-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
      .sel-card-name { font-size: 14px; font-weight: 700; color: #1a1a2e; flex: 1; padding-right: 24px; }
      .sel-card-price { font-size: 15px; font-weight: 800; color: #f59e0b; }
      .sel-card-meta { font-size: 12px; color: #777; display: flex; gap: 10px; flex-wrap: wrap; }

    /* 설문 카드 스타일 */
    .survey-card {
      background: #fff;
      border-radius: 16px 16px 16px 2px;
      border: 1px solid #e1e1e1;
      padding: 20px 20px 16px;
      max-width: 85%;
    }
    .survey-intro {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .survey-progress {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .survey-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d0dff5;
      transition: background 0.3s;
    }
    .survey-dot.active {
      background: #67adf9;
    }
    .survey-question {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .survey-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .survey-option {
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #444;
      cursor: pointer;
      transition: all 0.18s;
      background: #fff;
      text-align: left;
    }
    .survey-option:hover {
      border-color: #67adf9;
      background: #f0f6ff;
      color: #2563eb;
    }
    .survey-option.selected {
      border-color: #67adf9;
      background: #e8f1fd;
      color: #2563eb;
      font-weight: 600;
    }
    </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-header">✈️InsighTravel</div>
      <button class="new-chat-btn" onclick="startNewTrip()"><span>+</span> 새 여행 계획</button>
      <div class="history-label">최근 여행 기록</div>
      <nav class="chat-history-list">
      </nav>
    </aside>

    <div class="chat-panel">
      <div class="chat-header">✈️ 여행 에이전트</div>
      <div id="chat-log" class="chat-log"></div>
      <div class="input-panel">
        <div class="input-row">
          <textarea id="user-input" placeholder="궁금한 여행 일정을 입력하세요! &#10;예) 4월에 3박4일 도쿄 여행을 가려고 하는데 가볼만한 곳 추천해줘."></textarea>
          <button id="send-btn" class="send-btn" onclick="sendMessage()">보내기</button>
        </div>
    </div>
  </div>

  <div class="sel-modal-overlay" id="selection-modal">
    <div class="sel-modal-box">
      <div class="sel-modal-title" id="sel-modal-title">항목 선택</div>
      <div class="sel-modal-subtitle" id="sel-modal-subtitle">원하시는 항목을 클릭해 주세요.</div>
      <div class="sel-card-list" id="sel-card-list"></div>
      <div class="sel-actions">
        <button class="sel-cancel-btn" onclick="cancelSelectionModal()">취소</button>
        <button class="sel-confirm-btn" onclick="confirmSelectionModal()">예약하기</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="booking-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">✈️ 예약 진행 전 확인</div>
      <div class="modal-subtitle" id="modal-subtitle">예약에 필요한 정보를 입력해 주세요.</div>

      <div id="hotel-fields">
        <div class="modal-section-label">체크인 / 체크아웃 · 인원</div>
        <div class="modal-field-group">
          <input class="modal-field" id="m-checkin" placeholder="체크인" type="date" />
          <input class="modal-field" id="m-checkout" placeholder="체크아웃" type="date" />
          <input class="modal-field full" id="m-guests" type="number" min="1" max="10" value="2" />
        </div>
        <div class="modal-section-label">투숙객 정보</div>
        <div class="modal-field-group">
          <input class="modal-field full" id="m-guest-name" placeholder="대표 투숙객 성명 (예: 홍길동)" />
          <input class="modal-field" id="m-guest-email" placeholder="이메일" type="email" />
          <input class="modal-field" id="m-guest-phone" placeholder="연락처 (010-xxxx-xxxx)" />
        </div>
      </div>

      <div id="flight-fields" style="display:none;">
        <div class="modal-section-label">출국일 · 귀국일 · 인원</div>
        <div class="modal-field-group">
          <input class="modal-field" id="m-dep-date" type="date" />
          <input class="modal-field" id="m-ret-date" type="date" />
          <input class="modal-field full" id="m-pax-guests" type="number" min="1" max="10" value="1" />
        </div>
        <div class="modal-section-label">탑승객 정보 (여권 기재명)</div>
        <div class="modal-field-group">
          <input class="modal-field full" id="m-pax-name" placeholder="성명 (영문, 예: HONG GILDONG)" />
          <input class="modal-field" id="m-pax-birth" placeholder="생년월일 (년.월.일)" type="text" />
          <input class="modal-field" id="m-pax-nationality" placeholder="국적 (예: REPUBLIC OF KOREA)" />
          <input class="modal-field" id="m-pax-passport" placeholder="여권번호 (예: M12345678)" />
          <input class="modal-field" id="m-pax-passport-expiry" placeholder="여권 만료일 (년.월.일)" type="text" />
          <input class="modal-field" id="m-pax-email" placeholder="이메일" type="email" />
          <input class="modal-field" id="m-pax-phone" placeholder="연락처 (010-xxxx-xxxx)" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-cancel-btn" onclick="cancelBookingModal()">취소</button>
        <button class="modal-confirm-btn" onclick="confirmBookingModal()">예약 진행하기</button>
      </div>
    </div>
  </div>

  <script>
    // 세션 ID 생성 (브라우저별 1개 유지)
    let sessionId = localStorage.getItem("travel_session_id") || "sess-" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("travel_session_id", sessionId);

    // 최근 대화를 서버로 넘기기 위한 메모리
    let messages = [];
    let pendingBookingAction = null;
    let selectionSelectedIndex = 0;
    let selectionItems = [];

    // ─────────────────────────────────────────
    // 설문 데이터 정의
    // ─────────────────────────────────────────
    const SURVEY_QUESTIONS = [
      {
        q: "Q1. 어떤 분위기의 여행지를 선호하세요?",
        options: [
          { label: "🏙️ 도심 — 번화가, 쇼핑, 핫플레이스", value: "도심형" },
          { label: "🌿 자연/시골 — 한적한 풍경, 힐링",   value: "자연형" },
          { label: "⚖️ 둘 다 — 도심 + 자연 적당히",      value: "복합형" },
        ],
        key: "atmosphere"
      },
      {
        q: "Q2. 여행 예산 스타일은?",
        options: [
          { label: "💰 가성비 — 합리적인 가격으로 알차게",       value: "가성비" },
          { label: "✨ 프리미엄 — 편하고 여유롭게, 퀄리티 우선", value: "프리미엄" },
          { label: "〰️ 유동적 — 상황에 따라 다르게",            value: "유동적" },
        ],
        key: "budget"
      },
      {
        q: "Q3. 여행에서 가장 중요한 것은?",
        options: [
          { label: "🎯 관람/경험 — 명소, 전시, 액티비티", value: "관람경험" },
          { label: "🍽️ 식도락 — 맛집, 카페, 로컬 음식",   value: "식도락" },
          { label: "🛏️ 휴식 — 느긋하게 쉬는 것 자체",     value: "휴식" },
        ],
        key: "priority"
      },
      {
        q: "Q4. 여행 일정 스타일은?",
        options: [
          { label: "📋 계획형 — 시간표 빼곡하게 짜고 싶어요", value: "계획형" },
          { label: "🌊 즉흥형 — 그때그때 자유롭게",            value: "즉흥형" },
          { label: "📅 중간형 — 큰 틀만 잡고 여유 있게",       value: "중간형" },
        ],
        key: "schedule"
      },
    ];

    // 이번 세션 설문 결과 (세션 내 유지)
    let surveyAnswers = {};   // { atmosphere: "도심형", budget: "가성비", ... }
    let surveyComplete = false;
    let surveyRow = null;     // DOM 참조 (카드 업데이트용)
    let currentQ = 0;

    // ─────────────────────────────────────────
    // 설문 카드 렌더링
    // ─────────────────────────────────────────
    function renderSurveyCard() {
      const chatLog = document.getElementById("chat-log");

      // 처음 생성 시에만 row 삽입
      if (!surveyRow) {
        surveyRow = document.createElement("div");
        surveyRow.className = "message-row assistant";
        surveyRow.id = "survey-row";

        const avatar = document.createElement("img");
        avatar.src = DOG_AVATAR;
        avatar.className = "profile-avatar";
        surveyRow.appendChild(avatar);

        const wrap = document.createElement("div");
        wrap.className = "message-content";

        const name = document.createElement("div");
        name.className = "profile-name";
        name.textContent = "";

        const card = document.createElement("div");
        card.className = "survey-card";
        card.id = "survey-card";

        wrap.appendChild(name);
        wrap.appendChild(card);
        surveyRow.appendChild(wrap);
        chatLog.appendChild(surveyRow);
      }

      const card = document.getElementById("survey-card");
      const qData = SURVEY_QUESTIONS[currentQ];

      // 진행 도트
      const dotsHtml = SURVEY_QUESTIONS.map((_, i) =>
        `<div class="survey-dot${i <= currentQ ? " active" : ""}"></div>`
      ).join("");

      // 선택지 버튼
      const optionsHtml = qData.options.map(opt =>
        `<button class="survey-option" onclick="selectSurveyOption('${opt.value}')">${opt.label}</button>`
      ).join("");

      card.innerHTML = `
        <div class="survey-intro">안녕하세요 😊 여행을 더 잘 도와드리기 위해 간단한 질문 4가지에 먼저 답해주세요!</div>
        <div class="survey-progress">${dotsHtml}</div>
        <div class="survey-question">${qData.q}</div>
        <div class="survey-options">${optionsHtml}</div>
      `;

      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // ─────────────────────────────────────────
    // 선택지 클릭 핸들러
    // ─────────────────────────────────────────
    function selectSurveyOption(value) {
      const qData = SURVEY_QUESTIONS[currentQ];
      surveyAnswers[qData.key] = value;

      // 선택 시각 피드백
      document.querySelectorAll(".survey-option").forEach(btn => {
        btn.classList.toggle("selected", btn.textContent.includes(value.replace(/[^가-힣a-zA-Z]/g, "").slice(0,2)));
      });

      setTimeout(() => {
        currentQ++;
        if (currentQ < SURVEY_QUESTIONS.length) {
          renderSurveyCard();
        } else {
          finishSurvey();
        }
      }, 280);
    }

    // ─────────────────────────────────────────
    // 설문 완료 처리
    // ─────────────────────────────────────────
    async function finishSurvey() {
      surveyComplete = true;

      // 설문 카드를 완료 메시지로 교체
      const card = document.getElementById("survey-card");
      const summary = `분위기: ${surveyAnswers.atmosphere} / 예산: ${surveyAnswers.budget} / 중요: ${surveyAnswers.priority} / 일정: ${surveyAnswers.schedule}`;
      card.innerHTML = `
        <div class="survey-intro">설문이 완료됐어요! 🎉<br>취향을 기억해서 맞춤 여행을 도와드릴게요.<br><span style="font-size:12px;color:#888;">${summary}</span></div>
      `;

      // 서버에 설문 결과 전달
      try {
        await fetch("/survey", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, answers: surveyAnswers }),
        });
      } catch (e) {
        console.warn("설문 전달 실패:", e);
      }

      // 잠시 후 첫 안내 메시지
      setTimeout(() => {
        addMessage("assistant", "어떤 여행을 계획하고 계세요? 목적지, 기간, 인원 등을 알려주시면 바로 도와드릴게요! ✈️");
      }, 600);
    }

    function addNewChatToSidebar() {
      const historyList = document.querySelector(".chat-history-list");
      
      // 기존의 active 클래스 모두 제거
      document.querySelectorAll(".history-item").forEach(item => {
        item.classList.remove("active");
      });
    
      // 새 항목 생성
      const newItem = document.createElement("div");
      newItem.className = "history-item active"; // 새 항목을 활성화 상태로

      const textSpan = document.createElement("span");
      textSpan.className = "item-text";
      textSpan.textContent = "새로운 여행 계획";
      textSpan.style.flex = "1";
      textSpan.style.overflow = "hidden";
      textSpan.style.textOverflow = "ellipsis";
      textSpan.style.whiteSpace = "nowrap";
      
      // 버튼 그룹 생성
      const actionsDiv = document.createElement("div");
      actionsDiv.className = "item-actions";
  
      // 수정 버튼 
      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.innerHTML = "✏️";
      editBtn.onclick = (e) => {
        e.stopPropagation(); // 클릭 시 채팅방 전환 방지
        const newName = prompt("변경할 이름을 입력하세요:", textSpan.textContent);
        
        // 취소를 누르지 않았고, 빈 값이 아닐 때만 정확히 textSpan의 내용만 변경
        if (newName !== null && newName.trim() !== "") {
          textSpan.textContent = newName;
        }
      };

      // 삭제 버튼 
      const delBtn = document.createElement("button");
      delBtn.className = "action-btn";
      delBtn.innerHTML = "🗑️";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm("이 여행 기록을 삭제하시겠습니까?")) {
          newItem.remove();
          // 만약 현재 채팅방을 삭제했다면 채팅창 초기화
          if (newItem.classList.contains("active")) {
            document.getElementById("chat-log").innerHTML = "";
        }
      }
    };

      actionsDiv.appendChild(editBtn);
      actionsDiv.appendChild(delBtn);
  
      newItem.appendChild(textSpan);
      newItem.appendChild(actionsDiv);

      // 리스트의 가장 위에 추가
      historyList.prepend(newItem);
    }

    // ─────────────────────────────────────────
    // 새 여행 계획 시작 (사이드바 버튼)
    // ─────────────────────────────────────────
    function startNewTrip() {
      // 채팅 초기화
      document.getElementById("selection-modal").classList.remove("active");
      document.getElementById("booking-modal").classList.remove("active");
      document.getElementById("chat-log").innerHTML = "";

      // 데이터 및 상태 초기화
      messages = [];
      surveyAnswers = {};
      surveyComplete = false;
      surveyRow = null;
      currentQ = 0;

      // 새 세션 ID 생성
      sessionId = "sess-" + Math.random().toString(36).substring(2, 10);
      localStorage.setItem("travel_session_id", sessionId);

      // 사이드바에 새 항목 추가
      addNewChatToSidebar();

      // 설문 시작
      setTimeout(() => renderSurveyCard(), 300);
    }

    // 채팅 시작 시 설문 표시
    window.addEventListener("DOMContentLoaded", () => {
      showWelcomeMessage();
    });
 
    const DOG_AVATAR = "/static/profile.jpg";
    let loadingMessageId = null;

    function showWelcomeMessage() {
      const chatLog = document.getElementById("chat-log");
      
      chatLog.innerHTML = `
        <div style="
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          flex:1;
          text-align:center;
          gap:16px;
          padding:40px 20px;
        ">
          <div style="font-size:56px;">✈️</div>
          <div style="font-size:22px; font-weight:800; color:#222;">InsighTravel에 오신 걸 환영해요!</div>
          <div style="font-size:15px; color:#666; line-height:1.7;">
            나만의 맞춤 여행을 시작해보세요.<br>
            왼쪽의 <b style="color:#4693f8;">+ 새 여행 계획</b> 버튼을 눌러<br>
            새로운 여행 계획을 시작해보세요! 🌍
          </div>
          <button onclick="startNewTrip()" style="
            margin-top:8px;
            padding:12px 28px;
            background:#80baf8;
            color:#fff;
            border:none;
            border-radius:12px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(128,186,248,0.4);
            transition:background 0.2s;
          " onmouseover="this.style.background='#4693f8'" onmouseout="this.style.background='#80baf8'">
            + 새 여행 계획 시작하기
          </button>
        </div>
      `;
    }

    function addMessage(role, text) {
      const chatLog = document.getElementById("chat-log");
      const row = document.createElement("div");
      row.classList.add("message-row", role);
 
      if (role === "assistant") {
        const avatar = document.createElement("img");
        avatar.src = DOG_AVATAR;
        avatar.className = "profile-avatar";
        avatar.style.width = "60px";
        avatar.style.height = "60px";
        row.appendChild(avatar);
 
        const contentWrap = document.createElement("div");
        contentWrap.className = "message-content";

        const name = document.createElement("div");
        name.className = "profile-name";
        name.textContent = "";
 
        const bubble = document.createElement("div");
        bubble.classList.add("message", role);
        bubble.textContent = text;
 
        contentWrap.appendChild(name);
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);
      } else {
        const contentWrap = document.createElement("div");
        contentWrap.className = "message-content";
 
        const bubble = document.createElement("div");
        bubble.classList.add("message", role);
        bubble.textContent = text;
 
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);
      }
 
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // 로딩 메시지 표시 (점 애니메이션)
  function showLoadingMessage() {
  const chatLog = document.getElementById("chat-log");
  const row = document.createElement("div");
  row.classList.add("message-row", "assistant");
  row.id = "loading-message";

  const avatar = document.createElement("img");
  avatar.src = DOG_AVATAR;
  avatar.className = "profile-avatar";
  avatar.style.width = "60px";
  avatar.style.height = "60px";
  row.appendChild(avatar);

  const contentWrap = document.createElement("div");
  contentWrap.className = "message-content";

  const name = document.createElement("div");
  name.className = "profile-name";
  name.textContent = "";

  const bubble = document.createElement("div");
  bubble.classList.add("message", "assistant");
  bubble.id = "loading-bubble";
  bubble.className = "message assistant loading";
  bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

  contentWrap.appendChild(name);
  contentWrap.appendChild(bubble);
  row.appendChild(contentWrap);

  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
}

  // 로딩 메시지 제거
  function hideLoadingMessage() {
    const loadingMessage = document.getElementById("loading-message");
    if (loadingMessage) {
      loadingMessage.remove();
    }
  }
 
    function setDebugInfo(route, plan) {
      console.log("Debug Info:", { route, plan });
    }

    // 메시지 전송 함수
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      messages.push({ role: "user", text });

      const contextText = messages.slice(-6).map(m => `${m.role}: ${m.text}`).join("\n");
      // 설문 결과를 context 앞에 주입
      const surveyPrefix = surveyComplete
        ? `[사용자 여행 성향 설문결과] 여행분위기:${surveyAnswers.atmosphere} / 예산스타일:${surveyAnswers.budget} / 여행우선순위:${surveyAnswers.priority} / 일정스타일:${surveyAnswers.schedule}\n\n`
        : "";
      const fullContext = surveyPrefix + contextText;
      input.value = "";
      sendBtn.disabled = true;

      showLoadingMessage(); // 로딩 메시지 표시

      try {
        const res = await fetch("/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text, context: fullContext, survey: surveyAnswers }),
        });

        const data = await res.json();

        hideLoadingMessage(); // 로딩 메시지 제거

        let bookingAction = null;
        try { bookingAction = JSON.parse(data.reply); } catch (e) { }

        if (bookingAction && bookingAction.__booking_action__) {
          addMessage("assistant", bookingAction.message);
          messages.push({ role: "assistant", text: bookingAction.message });
          if (bookingAction.needs_selection) await openSelectionModal(bookingAction);
          else openBookingModal(bookingAction);
        } else {
          addMessage("assistant", data.reply);
          messages.push({ role: "assistant", text: data.reply });
        }
        setDebugInfo(data.route, data.plan);
      } catch (err) {
        addMessage("assistant", "서버 오류가 발생했습니다.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    // 선택 모달 로직
    async function openSelectionModal(action) {
      pendingBookingAction = action;
      const isHotel = action.booking_type === "hotel";
      try {
        const res = await fetch(`/api/booking/data?session_id=${action.session_id}&type=${isHotel ? "hotel" : "flight"}`);
        selectionItems = (await res.json()).items || [];
      } catch (e) { selectionItems = []; }

      selectionSelectedIndex = action.item_index || 0;
      document.getElementById("sel-modal-title").textContent = isHotel ? "🏨 숙소 선택" : "✈️ 항공편 선택";
      renderSelectionCards(selectionItems, isHotel);
      document.getElementById("selection-modal").classList.add("active");
    }

    function renderSelectionCards(items, isHotel) {
      const listEl = document.getElementById("sel-card-list");
      listEl.innerHTML = items.length ? "" : '<div style="padding:24px;text-align:center;">결과가 없습니다.</div>';
      items.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "sel-card" + (i === selectionSelectedIndex ? " sel-selected" : "");
        if (isHotel) {
          card.innerHTML = `<div class="sel-card-top"><div class="sel-card-name">${item.name}</div><div class="sel-card-price">${item.price}</div></div>`;
        } else {
          card.innerHTML = `<div class="sel-card-top"><div class="sel-card-name">${item.airline}</div><div class="sel-card-price">${item.price}</div></div><div class="sel-card-meta"><span>${item.origin}→${item.destination}</span><span>${item.dep_time}</span><span>${item.stops}</span></div>`;
        }
        card.addEventListener("click", () => {
          selectionSelectedIndex = i;
          document.querySelectorAll(".sel-card").forEach((c, j) => c.classList.toggle("sel-selected", j === i));
        });
        listEl.appendChild(card);
      });
    }

    function cancelSelectionModal() {
      document.getElementById("selection-modal").classList.remove("active");
      addMessage("assistant", "예약을 취소했습니다.");
    }
    function confirmSelectionModal() {
      document.getElementById("selection-modal").classList.remove("active");
      pendingBookingAction.item_index = selectionSelectedIndex;
      openBookingModal(pendingBookingAction);
    }

    // 예약 모달 로직
    function openBookingModal(action) {
      pendingBookingAction = action;
      const isHotel = action.booking_type === "hotel";
      const pf = action.prefill || {};
      document.getElementById("hotel-fields").style.display = isHotel ? "block" : "none";
      document.getElementById("flight-fields").style.display = isHotel ? "none" : "block";
      if (isHotel) {
        document.getElementById("m-checkin").value = pf.checkin || "";
        document.getElementById("m-checkout").value = pf.checkout || "";
        document.getElementById("m-guests").value = pf.guests || 2;
      } else {
        document.getElementById("m-dep-date").value = pf.departure_date || "";
        document.getElementById("m-ret-date").value = pf.return_date || "";
        document.getElementById("m-pax-guests").value = pf.guests || 1;
      }
      document.getElementById("booking-modal").classList.add("active");
    }

    function cancelBookingModal() {
      document.getElementById("booking-modal").classList.remove("active");
      addMessage("assistant", "예약을 취소했습니다.");
    }

    function confirmBookingModal() {
      let userInfo = {};
      if (pendingBookingAction.booking_type === "hotel") {
        userInfo = {
          name: document.getElementById("m-guest-name").value,
          email: document.getElementById("m-guest-email").value,
          phone: document.getElementById("m-guest-phone").value,
          checkin: document.getElementById("m-checkin").value,
          checkout: document.getElementById("m-checkout").value,
          guests: document.getElementById("m-guests").value
        };
      } else {
        userInfo = {
          name: document.getElementById("m-pax-name").value,
          birth: document.getElementById("m-pax-birth").value,
          nationality: document.getElementById("m-pax-nationality").value,
          passport: document.getElementById("m-pax-passport").value,
          passport_expiry: document.getElementById("m-pax-passport-expiry").value,
          email: document.getElementById("m-pax-email").value,
          phone: document.getElementById("m-pax-phone").value,
          departure_date: document.getElementById("m-dep-date").value,
          return_date: document.getElementById("m-ret-date").value,
          guests: document.getElementById("m-pax-guests").value
        };
      }
      document.getElementById("booking-modal").classList.remove("active");
      showAgentBrowser(pendingBookingAction, userInfo);
    }

    // 아이프레임 로드
    function showAgentBrowser(action, userInfo) {
      const urlPath = action.booking_type === "hotel" ? "hotel" : "flight";
      const realUrl = `/booking/${urlPath}?session_id=${action.session_id}&item_index=${action.item_index}&autobook=true&user_info=${encodeURIComponent(JSON.stringify(userInfo))}`;
      const wrapper = document.createElement("div");
      wrapper.className = "agent-browser";
      wrapper.innerHTML = `
        <div class="agent-browser-bar"><span class="browser-dot dot-red"></span><span class="browser-dot dot-yellow"></span><span class="browser-dot dot-green"></span></div>
        <div class="agent-status">예약 사이트 접속 중...</div>
        <iframe src="${realUrl}"></iframe>`;
      document.getElementById("chat-log").appendChild(wrapper);
    }

    window.addEventListener("message", e => {
      if (e.data && e.data.type === "booking_complete") {
        addMessage("assistant", `✅ 예약이 완료되었습니다! 확인번호: ${e.data.booking_id}`);
      }
    });

    document.getElementById("user-input").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });</script>
</body>
